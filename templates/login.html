<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .logo svg { width: 36px; height: 36px; }
    .logo-text { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; text-align: center; }
    p.sub { color: #6b7280; font-size: 0.875rem; text-align: center; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: #9ca3af; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 1rem;
      padding: 0.65rem 0.875rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #7c3aed; }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.65rem 0.875rem;
      font-size: 0.875rem;
      margin-top: 0.75rem;
    }
    button {
      width: 100%;
      margin-top: 1.25rem;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #6d28d9; }
    .lock { color: #7c3aed; font-size: 0.8rem; text-align: center; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="10" fill="#7c3aed"/>
        <path d="M10 26L18 10L26 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 21h10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">AI Studio</span>
    </div>
    <h2>Welcome back</h2>
    <p class="sub">Enter your password to access the studio</p>
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autofocus autocomplete="current-password" />
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit">Sign In</button>
    </form>
    <p class="lock">Private &amp; Secure — Access Restricted</p>
  </div>
</body>
</html>
